name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    # Ubuntu 22.04 rather than a newer image: Wails v2 links against
    # webkit2gtk-4.0, which 24.04 no longer packages.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^frontend/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...

      # -race because the app is several goroutines around one mutex, and the
      # bugs that costs are exactly the ones a plain run hides.
      - run: go test -race ./...

  frontend:
    name: Frontend
    # Ubuntu 22.04 for the same reason as the Go job: generating the bindings
    # compiles the application, which links against webkit2gtk-4.0.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # frontend/wailsjs is generated from the bound Go methods and is not in
      # the repository, so a fresh checkout has no bindings at all. Every file
      # that calls the backend imports them, which means nothing — not tsc, not
      # the Vite build — can resolve a single import until this has run.
      - name: Generate the bindings
        run: wails generate module

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
