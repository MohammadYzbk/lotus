name: Release

# Builds an installable Lotus for each platform, with the TeX engine inside it.
#
# Signing is conditional. Every signing step is skipped when its secrets are
# absent, so this workflow produces working — if unsigned — artifacts in a fork
# or before certificates exist, rather than failing. An unsigned build is
# marked as such in the release notes: macOS Gatekeeper and Windows SmartScreen
# will both warn about one, and a writer should know that is expected rather
# than a sign something is wrong.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform's failure should not destroy the other three artifacts;
      # a partial release is still worth inspecting.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            runner: macos-14
            platform: darwin/arm64
            artifact: lotus-macos-arm64
          - name: macOS (Intel)
            runner: macos-15-intel
            platform: darwin/amd64
            artifact: lotus-macos-amd64
          - name: Windows
            runner: windows-latest
            platform: windows/amd64
            artifact: lotus-windows-amd64
          - name: Linux
            runner: ubuntu-22.04
            platform: linux/amd64
            artifact: lotus-linux-amd64

    env:
      # Job level so the Windows signing steps can test for the certificate:
      # a step's own env is not yet set when its `if` is evaluated.
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The installer, the .exe's file properties, and Info.plist all want
          # a plain numbers-and-dots version, so 1.2.0-beta.1 becomes 1.2.0.
          echo "numeric=${version%%[-+]*}" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # wails.json's productVersion feeds the Windows file properties, the
      # installer's entry in Apps & features, and the macOS Info.plist. Left
      # alone, every release would call itself whatever the file last said.
      - name: Stamp the version into wails.json
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("wails.json", "utf8"));
            config.info.productVersion = process.argv[1];
            fs.writeFileSync("wails.json", JSON.stringify(config, null, 2) + "\n");
          ' "${{ steps.version.outputs.numeric }}"

      - name: Install the Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # Chocolatey installs makensis without putting it on PATH, and Wails
      # skips the installer with only a warning when it cannot find it.
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # The version is stamped in here and nowhere else, so the About box and
      # the update check always agree with the tag that produced the build.
      #
      # On Windows, -nsis is here only for its side effects: it renders
      # wails_tools.nsh and fetches the WebView2 bootstrapper the installer
      # script needs. The installer it makes is rebuilt below, once the engine
      # is in place and the binaries are signed.
      - name: Build
        shell: bash
        run: wails build -platform ${{ matrix.platform }} ${{ runner.os == 'Windows' && '-nsis' || '' }} -ldflags "-X main.version=${{ steps.version.outputs.version }}"

      # Before signing: a signature has to cover the engine, and a file added
      # to a signed bundle afterwards invalidates it.
      - name: Bundle the TeX engine
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            go run ./build/cmd/bundle-engine -app build/bin/lotus.app -platform ${{ matrix.platform }}
          else
            go run ./build/cmd/bundle-engine -app build/bin -platform ${{ matrix.platform }}
          fi

      # --- macOS signing and notarisation ------------------------------------

      - name: Sign the macOS app
        if: runner.os == 'macOS' && env.CERTIFICATE != ''
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # A keychain of this job's own, so nothing touches the runner's login
          # keychain and the private key dies with the runner.
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"

          # The nested engine is signed first: codesign seals inner code into
          # the outer signature, so the order is inside out.
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" build/bin/lotus.app/Contents/Resources/engine/tectonic
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" build/bin/lotus.app
          codesign --verify --deep --strict --verbose=2 build/bin/lotus.app

      - name: Notarise the macOS app
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/bin/lotus.app "$RUNNER_TEMP/lotus.zip"
          xcrun notarytool submit "$RUNNER_TEMP/lotus.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          # Stapling puts the notarisation ticket inside the app, so Gatekeeper
          # accepts it on a machine that is offline at first launch.
          xcrun stapler staple build/bin/lotus.app

      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Staged with a shortcut to /Applications beside the app, so the disk
          # image is a drag-and-drop install for anyone not using the script.
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R build/bin/lotus.app "$stage/Lotus.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Lotus ${{ steps.version.outputs.version }}" \
            -srcfolder "$stage" -ov -format UDZO "build/bin/${{ matrix.artifact }}.dmg"

      # --- Windows -----------------------------------------------------------

      # The engine ships inside the installer, so it is signed too.
      - name: Sign the Windows executable
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./build/windows/sign.ps1 -Path build\bin\lotus.exe, build\bin\engine\tectonic.exe

      # makensis directly rather than `wails build -nsis` again: that would
      # recompile lotus.exe, replacing the signed binary with an unsigned one,
      # and Wails' installer packs only the executable, not the engine beside
      # it. Paths are relative to the script, since makensis runs from there.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          (cd build/windows/installer && makensis \
            '-DARG_WAILS_AMD64_BINARY=..\..\bin\lotus.exe' \
            '-DLOTUS_ENGINE_DIR=..\..\bin\engine' \
            project.nsi)
          mv build/bin/lotus-amd64-installer.exe "build/bin/${{ matrix.artifact }}-installer.exe"

      - name: Sign the Windows installer
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./build/windows/sign.ps1 -Path build\bin\${{ matrix.artifact }}-installer.exe

      # For a machine where installing needs an administrator the writer does
      # not have: unzip anywhere and run lotus.exe. The engine is found beside
      # it, exactly as in an installed copy.
      - name: Package the portable Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build\bin\lotus.exe, build\bin\engine `
            -DestinationPath build\bin\${{ matrix.artifact }}-portable.zip

      # --- Linux -------------------------------------------------------------

      - name: Package the Linux build
        if: runner.os == 'Linux'
        run: tar -czf "build/bin/${{ matrix.artifact }}.tar.gz" -C build/bin lotus engine

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*.dmg
            build/bin/*.tar.gz
            build/bin/*.zip
            build/bin/*-installer.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    # Only a tag publishes. A manual run builds and leaves the artifacts on the
    # run, so a release can be rehearsed without creating one.
    #
    # !cancelled() rather than the default success(): one platform failing
    # should not keep the others off the releases page. The release is a
    # draft, so a missing platform is seen before anyone can download it.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # scripts/install.sh checks the download against this before installing
      # it. Same host serves both, so it catches a truncated download rather
      # than attesting to anything.
      - name: Checksums
        run: |
          cd artifacts
          # Written outside the directory first: the shell creates the
          # redirect target before the glob runs, so writing it in place would
          # checksum the half-written file itself.
          sha256sum ./* > "$RUNNER_TEMP/checksums.txt"
          mv "$RUNNER_TEMP/checksums.txt" checksums.txt
          cat checksums.txt

      # The install notes go first, then GitHub's generated changelog.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          body_path: .github/release-notes.md
          generate_release_notes: true
